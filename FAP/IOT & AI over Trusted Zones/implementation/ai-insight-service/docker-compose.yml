services:
  ai-insight:
    build: .
    container_name: facis-ai-insight
    ports:
      - "8080:8080"
    environment:
      - FACIS_ENV=development
      - AI_INSIGHT_HTTP__HOST=0.0.0.0
      - AI_INSIGHT_HTTP__PORT=8080
      - AI_INSIGHT_LOGGING__LEVEL=INFO
      - AI_INSIGHT_OPENAI__API_KEY=${AI_INSIGHT_OPENAI__API_KEY:-}
      - AI_INSIGHT_OPENAI__MODEL=${AI_INSIGHT_OPENAI__MODEL:-gpt-4.1-mini}
      - AI_INSIGHT_TRINO__HOST=${AI_INSIGHT_TRINO__HOST:-localhost}
      - AI_INSIGHT_TRINO__PORT=${AI_INSIGHT_TRINO__PORT:-8080}
      - AI_INSIGHT_TRINO__USER=${AI_INSIGHT_TRINO__USER:-trino}
      - AI_INSIGHT_TRINO__CATALOG=${AI_INSIGHT_TRINO__CATALOG:-hive}
      - AI_INSIGHT_TRINO__SCHEMA=${AI_INSIGHT_TRINO__SCHEMA:-default}
      - AI_INSIGHT_TRINO__HTTP_SCHEME=${AI_INSIGHT_TRINO__HTTP_SCHEME:-http}
    volumes:
      - ai-insight-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/health', timeout=2)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ai-insight-data:
