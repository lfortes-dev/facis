openapi: 3.0.3
info:
  title: FACIS AI Insight Service
  description: |
    REST API for AI-powered insight generation from energy and IoT datasets.
    This specification is the source of truth served at `/docs` and `/openapi.json`.
    For Trino authentication, the service automatically enables Keycloak OIDC
    password-flow token exchange when `AI_INSIGHT_TRINO__OIDC_TOKEN_URL` is set.
  version: 0.1.0
  contact:
    name: ATLAS IoT Lab GmbH
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: health
    description: Service availability endpoints
  - name: insights
    description: Outlier analytics and LLM-ready context generation

paths:
  /api/v1/health:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns service status and name.
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                service: ai-insight-service

  /api/v1/insights/net-grid/outliers:
    post:
      operationId: analyzeNetGridOutliers
      tags: [insights]
      summary: Analyze net-grid outliers
      description: |
        Query `gold.net_grid_hourly` for the requested window, compare
        consumption vs generation and cost behavior, detect robust statistical
        outliers (MAD-based robust z-score), and return structured context for LLM use.

        Runtime behavior:
        - OIDC disabled when `AI_INSIGHT_TRINO__OIDC_TOKEN_URL` is empty
        - OIDC password-flow enabled when `AI_INSIGHT_TRINO__OIDC_TOKEN_URL` is set
        - Trino TLS verification uses `AI_INSIGHT_TRINO__VERIFY`
        - Keycloak TLS verification uses `AI_INSIGHT_TRINO__OIDC_VERIFY`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetGridOutlierRequest"
            example:
              start_ts: "2026-03-01T00:00:00Z"
              end_ts: "2026-03-08T00:00:00Z"
              timezone: "UTC"
              robust_z_threshold: 3.5
      responses:
        "200":
          description: Structured context generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetGridOutlierResponse"
              example:
                context:
                  window:
                    start_ts: "2026-03-01T00:00:00+00:00"
                    end_ts: "2026-03-08T00:00:00+00:00"
                    timezone: "UTC"
                    rows_analyzed: 168
                  baseline_stats: []
                  outlier_events: []
                  cost_anomalies: []
                  narrative_hints:
                    - No robust outliers detected for the selected metrics and window.
                  summary:
                    total_outliers: 0
                    outliers_by_metric: {}
                    selected_metrics: []
        "400":
          description: Invalid input parameters (for example, start_ts >= end_ts)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: start_ts must be earlier than end_ts
        "502":
          description: >
            Upstream query or processing failure (for example TLS trust issues,
            OIDC token exchange failure, invalid credentials, missing catalog, or Trino errors)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Upstream Trino request timed out
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

components:
  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: ai-insight-service

    NetGridOutlierRequest:
      type: object
      required: [start_ts, end_ts]
      properties:
        start_ts:
          type: string
          format: date-time
          description: Inclusive start timestamp (ISO 8601)
          example: "2026-03-01T00:00:00Z"
        end_ts:
          type: string
          format: date-time
          description: Exclusive end timestamp (ISO 8601)
          example: "2026-03-08T00:00:00Z"
        timezone:
          type: string
          description: Timezone label used in generated context
          default: UTC
          example: UTC
        robust_z_threshold:
          type: number
          format: float
          description: MAD-based robust z-score sensitivity threshold (> 0)
          minimum: 0
          exclusiveMinimum: true
          default: 3.5
          example: 3.5

    NetGridOutlierResponse:
      type: object
      required: [context]
      properties:
        context:
          type: object
          description: Structured LLM context payload
          additionalProperties: true

    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          example: start_ts must be earlier than end_ts

    ValidationErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: array
          items:
            $ref: "#/components/schemas/ValidationErrorItem"

    ValidationErrorItem:
      type: object
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          items:
            oneOf:
              - type: string
              - type: integer
        msg:
          type: string
        type:
          type: string
